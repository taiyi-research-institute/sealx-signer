name: Release Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to publish (comma separated, or "all")'
        required: false
        default: 'all'

  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  check-versions:
    name: Check version changes
    runs-on: ubuntu-latest
    outputs:
      publish-core: ${{ steps.check.outputs.core }}
      publish-message: ${{ steps.check.outputs.message }}
      publish-sdk: ${{ steps.check.outputs.sdk }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Check local vs remote versions
        id: check
        run: |
          check_package() {
            local name=$1
            local path=$2

            if [[ "${{ github.event.inputs.packages }}" != "all" && "${{ github.event.inputs.packages }}" != "" ]]; then
              if ! echo "${{ github.event.inputs.packages }}" | grep -q "$name"; then
                echo "$name not selected, skipping"
                echo "${name#sealx-}=false" >> $GITHUB_OUTPUT
                return
              fi
            fi

            LOCAL=$(node -p "require('./$path/package.json').version")
            REMOTE=$(npm view "$name" version 2>/dev/null || echo "0.0.0")
            echo "$name: local=$LOCAL remote=$REMOTE"

            SHOULD_PUBLISH=$(node -e "
              const local = '$LOCAL'.split('.').map(Number);
              const remote = '$REMOTE'.split('.').map(Number);
              for (let i = 0; i < 3; i++) {
                if (local[i] > remote[i]) { console.log('true'); process.exit(0); }
                if (local[i] < remote[i]) { console.log('false'); process.exit(0); }
              }
              console.log('false');
            ")

            echo "$name publish: $SHOULD_PUBLISH"
            echo "${name#sealx-}=$SHOULD_PUBLISH" >> $GITHUB_OUTPUT
          }

          check_package "sealx-core" "packages/sealx-core"
          check_package "sealx-message" "packages/sealx-message"
          check_package "sealx-sdk" "packages/sealx-sdk"

  publish-core:
    name: Publish sealx-core
    runs-on: ubuntu-latest
    needs: check-versions
    if: needs.check-versions.outputs.publish-core == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: packages/sealx-core
        run: npm install

      - name: Build
        working-directory: packages/sealx-core
        run: npm run build

      - name: Publish to npm
        working-directory: packages/sealx-core
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-message:
    name: Publish sealx-message
    runs-on: ubuntu-latest
    needs: check-versions
    if: needs.check-versions.outputs.publish-message == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: packages/sealx-message
        run: npm install

      - name: Build
        working-directory: packages/sealx-message
        run: npm run build

      - name: Publish to npm
        working-directory: packages/sealx-message
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-sdk:
    name: Publish sealx-sdk
    runs-on: ubuntu-latest
    needs: check-versions
    if: needs.check-versions.outputs.publish-sdk == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: packages/sealx-sdk
        run: npm install

      - name: Build
        working-directory: packages/sealx-sdk
        run: npm run build

      - name: Publish to npm
        working-directory: packages/sealx-sdk
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  check-extension:
    name: Check extension release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/extension-v')
    outputs:
      extension-version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Extract extension version from tag
        id: extract
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#extension-v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extension version: $VERSION"

  publish-extension:
    name: Publish Extension to Chrome Web Store
    runs-on: ubuntu-latest
    needs: check-extension
    if: needs.check-extension.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Build extension
        working-directory: extension
        run: pnpm run build

      - name: Zip extension
        working-directory: extension
        run: |
          cd dist_chrome
          zip -r ../sealx-v${{ needs.check-extension.outputs.extension-version }}.zip ./*

      - name: Upload to Chrome Web Store
        working-directory: extension
        run: |
          npx chrome-webstore-upload-cli upload \
            --source sealx-v${{ needs.check-extension.outputs.extension-version }}.zip \
            --extension-id ${{ secrets.CHROME_EXTENSION_ID }} \
            --client-id ${{ secrets.CHROME_CLIENT_ID }} \
            --client-secret ${{ secrets.CHROME_CLIENT_SECRET }} \
            --refresh-token ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Publish to Chrome Web Store
        working-directory: extension
        run: |
          npx chrome-webstore-upload-cli publish \
            --extension-id ${{ secrets.CHROME_EXTENSION_ID }} \
            --client-id ${{ secrets.CHROME_CLIENT_ID }} \
            --client-secret ${{ secrets.CHROME_CLIENT_SECRET }} \
            --refresh-token ${{ secrets.CHROME_REFRESH_TOKEN }}
