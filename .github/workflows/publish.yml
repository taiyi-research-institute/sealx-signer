name: Release Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to publish (comma separated, or "all")'
        required: false
        default: 'all'

  release:
    types: [published]

permissions:
  contents: write
  id-token: write

env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  publish-core:
    name: Publish sealx-core
    runs-on: ubuntu-latest
    if: github.event.inputs.packages == 'all' || contains(github.event.inputs.packages, 'sealx-core') || github.event.inputs.packages == '' || github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: packages/sealx-core
        run: npm ci

      - name: Build
        working-directory: packages/sealx-core
        run: npm run build

      - name: Publish to npm
        working-directory: packages/sealx-core
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-message:
    name: Publish sealx-message
    runs-on: ubuntu-latest
    needs: publish-core
    if: github.event.inputs.packages == 'all' || contains(github.event.inputs.packages, 'sealx-message') || github.event.inputs.packages == '' || github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: packages/sealx-message
        run: npm ci

      - name: Build
        working-directory: packages/sealx-message
        run: npm run build

      - name: Publish to npm
        working-directory: packages/sealx-message
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-sdk:
    name: Publish sealx-sdk
    runs-on: ubuntu-latest
    needs: publish-message
    if: github.event.inputs.packages == 'all' || contains(github.event.inputs.packages, 'sealx-sdk') || github.event.inputs.packages == '' || github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: packages/sealx-sdk
        run: npm ci

      - name: Build
        working-directory: packages/sealx-sdk
        run: npm run build

      - name: Publish to npm
        working-directory: packages/sealx-sdk
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
